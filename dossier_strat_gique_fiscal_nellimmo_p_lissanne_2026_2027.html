loyer sous peine de requalification en revenu distribué (Art. 109 CGI)."},{code:"Code Général des Impôts",article:"Art. 200 A",title:"Prélèvement Forfaitaire Unique (PFU / Flat Tax à 30%) sur les Dividendes",summary:"Imposition forfaitaire à taux unique de 30% (12,8% IR + 17,2% prélèvements sociaux) sur les dividendes de capitaux mobiliers en SASU.",fullQuote:"Les revenus de capitaux mobiliers perçus par des personnes physiques fiscalement domiciliées en France sont soumis à l'impôt sur le revenu au taux forfaitaire de 12,8 %, auquel s'ajoutent les prélèvements sociaux au taux global de 17,2 %, soit un taux d'imposition global de 30 % (ou 31,4 % avec la surtaxe financière). Le contribuable peut opter de manière globale et expresse pour le barème progressif de l'impôt sur le revenu.",officialSourceUrl:"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000042911246",practicalApplication:"En tant que Présidente de SASU, Nelly Fernandez ne paie AUCUNE cotisation sociale sur ses dividendes de Nell'Immo. Elle paie 30% d'impôt total sous Continuité/RN, contre une soumission intégrale au barème progressif de l'IR et aux cotisations sociales (~35%) prévue sous le programme LFI/NFP.",urssafSafeguard:"Ne pas confondre avec la SARL où les dividendes excédant 10% du capital social sont requalifiés en rémunération TNS (Art. L. 131-6 CSS)."},{code:"Code Général des Impôts",article:"Art. 194-II & 195",title:"Quotient Familial en Garde Alternée et Majoration Parent Isolé (Case T)",summary:"Règles d'attribution des parts fiscales pour 2 enfants en garde alternée avec ou sans vie de couple.",fullQuote:"En cas de résidence alternée au domicile de chacun des parents, les enfants sont réputés à la charge égale de l'un et de l'autre. Cette charge ouvre droit à un quart de part pour chacun des deux premiers enfants et à une demi-part pour chaque enfant à compter du troisième. Le parent vivant seul bénéficie d'une majoration de quotient familial au titre du premier enfant à charge.",officialSourceUrl:"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000041468641",practicalApplication:"Nelly a 2 filles (5 et 11 ans) en résidence alternée. Base célibataire : 1,0 part. 1re fille : 0,25 part + 0,25 part Case T (Parent Isolé vivant seul) = 0,5 part. 2e fille : 0,25 part. Total = 1,75 parts fiscales. Si Nelly vit en concubinage (sans cocher Case T), elle a 1,5 part.",urssafSafeguard:"La case T ne peut être cochée que si Nelly vit effectivement seule au 1er janvier de l'année d'imposition (pas de concubinage notoire ni de PACS avec un tiers sous le même toit)."},{code:"Code Général des Impôts",article:"Art. 244 quater F",title:"Crédit d'Impôt Famille de 25% pour l'Entreprise (CESU Dirigeant)",summary:"Exonération totale d'impôt et de charges sociales sur les CESU accordés par Nell'Immo à sa dirigeante, avec 25% de crédit d'impôt remboursé à l'agence.",fullQuote:"Les entreprises qui engagent des dépenses pour aider leurs salariés ou leurs dirigeants à financer des services à la personne bénéficient d'un crédit d'impôt égal à 25 % des dépenses engagées, dans la limite de 500 000 € par année civile. L'aide est exonérée de toute cotisation sociale et d'impôt sur le revenu.",officialSourceUrl:"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000038834927",practicalApplication:"Nell'Immo verse 2 591 € de CESU préfinancés à Nelly en 2026. L'agence déduit 2 591 € de son résultat fiscal et reçoit un crédit d'impôt de 647,75 € (25%). Nelly utilise ces chèques pour le ménage dans sa maison de 305k€ ou pour les cours de piano à domicile de sa fille de 11 ans sans payer 1 € d'IR ni d'URSSAF.",urssafSafeguard:"Même sans salarié, le chef d'entreprise peut en bénéficier si le dispositif est ouvert à tous les bénéficiaires éventuels de l'entreprise par décision formelle inscrite au registre des décisions."},{code:"Code Général des Impôts",article:"Art. 199 sexdecies",title:"Crédit d'Impôt de 50% sur les Dépenses d'Aide à Domicile et Cours Particuliers",summary:"Crédit d'impôt personnel sur le reste à charge des cours de piano et aide aux devoirs dispensés au domicile de Pélissanne.",fullQuote:"Ouvrent droit à un crédit d'impôt sur le revenu les sommes payées par un contribuable domicilié en France pour l'emploi d'un salarié qui rend des services définis à l'article L. 7231-1 du code du travail au domicile du contribuable.",officialSourceUrl:"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000042911364",practicalApplication:"Si les cours de piano de l'aînée sont dispensés à domicile par un intervenant agréé ou en emploi direct, la part non couverte par le CESU de Nell'Immo donne droit à 50% de crédit d'impôt sur l'IR de Nelly.",urssafSafeguard:"Exiger une attestation fiscale annuelle délivrée par l'organisme agréé ou éditer les déclarations URSSAF CESU mensuelles."},{code:"Code du Travail",article:"Art. L3332-2 & R3324-22",title:"Déblocage Anticipé du Plan d'Épargne d'Entreprise (PEE) pour Achat de la Résidence Principale",summary:"Permet d'extraire de la trésorerie de Nell'Immo abondée à 300% avec 0% d'IR grâce à l'acte d'achat de la maison à 305 000 €.",fullQuote:"Le jugement ou l'acte authentique constatant l'acquisition d'une résidence principale autorise le déblocage anticipé des droits acquis au titre de la participation ou du plan d'épargne d'entreprise dans un délai de six mois suivant la réalisation de l'événement. Les sommes débloquées sont intégralement exonérées d'impôt sur le revenu et ne sont soumises qu'aux prélèvements sociaux de 9,7 % sur les plus-values.",officialSourceUrl:"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000030580922",practicalApplication:"Avec 1 salarié (même alternant), Nell'Immo met en place un PEE avec un abondement maximal de 3 880 €/an exonéré d'IS, de charges et d'IR (seule la CSG de 9,7% s'applique). L'achat de la maison à 305 000 € sert de justificatif légal de déblocage pour sortir jusqu'à 12 500 € nets d'impôt.",urssafSafeguard:"Pour le PEE, il faut impérativement au moins 1 salarié distinct du mandataire social ayant au moins 3 mois d'ancienneté. Sinon, utiliser le PER individuel."},{code:"Code Général des Impôts",article:"Art. 669",title:"Barème Fiscal du Démembrement de Propriété (Usufruit & Nue-Propriété)",summary:"Valorisation fiscale de la nue-propriété transmise aux 2 filles avant 51 ans.",fullQuote:"Pour la liquidation des droits d'enregistrement et de la taxe de publicité foncière, la valeur de la nue-propriété et de l'usufruit est déterminée par une quotité de la valeur de la propriété entière : lorsque l'usufruitier a moins de 51 ans révolus, la valeur de l'usufruit est de 60 % et la valeur de la nue-propriété est de 40 %.",officialSourceUrl:"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006310156",practicalApplication:"Pour la maison de 305 000 €, la nue-propriété totale ne vaut fiscalement que 40% (122 000 €). Transmise à ses 2 filles, la valeur donnée est de 61 000 € par fille. Comme l'abattement légal (Art. 779 CGI) est de 100 000 € par enfant, Nelly paie 0 € de droits de succession ou donation.",urssafSafeguard:"Réaliser la donation par acte notarié officiel avant le 51e anniversaire de Nelly pour figer la quote-part à 40%."},{code:"Code Général des Impôts",article:"Art. 779",title:"Abattement Légal de 100 000 € par Enfant sur les Donations et Successions",summary:"Exonération fiscale renouvelable tous les 15 ans pour toute donation en ligne directe aux enfants.",fullQuote:"Pour la perception des droits de mutation à titre gratuit, il est effectué un abattement de 100 000 € sur la part de chacun des ascendants et sur la part de chacun des enfants vivants ou représentés. Cet abattement s'applique pour les donations entre vifs et pour les successions, et se renouvelle tous les quinze ans.",officialSourceUrl:"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000026284643",practicalApplication:"Nelly peut donner jusqu'à 100 000 € à sa fille cadette de 5 ans et 100 000 € à son aînée de 11 ans sans payer le moindre centime d'impôt. Le RN propose de ramener ce délai à 10 ans (au lieu de 15 ans).",urssafSafeguard:"L'acte doit être obligatoirement enregistré auprès du Service de la Publicité Foncière et de l'Enregistrement (SPFE) pour faire courir le délai de prescription et de renouvellement."},{code:"Code Général des Impôts",article:"Art. 39-1",title:"Déduction Fiscale des Travaux d'Aménagement et Équipements Professionnels",summary:"Prise en charge intégrale par la société des factures d'aménagement du bureau, climatisation et borne électrique.",fullQuote:"Le bénéfice net est établi sous déduction de toutes charges, celles-ci comprenant notamment : 1° Les frais généraux de toute nature, les dépenses de personnel et de main-d'œuvre, le loyer des immeubles dont l'entreprise est locataire, et les dépenses d'entretien et de réparation des locaux affectés à l'exploitation.",officialSourceUrl:"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000043813337",practicalApplication:"Nell'Immo paie directement 4 500 € HT de travaux pour aménager les 35 m² de bureau/archives à Pélissanne (peinture, cloisons, climatisation réversible) et récupère 900 € de TVA à 20%.",urssafSafeguard:"Les travaux doivent bénéficier exclusivement à la zone professionnelle délimitée au bail. Tout aménagement de la partie privative (cuisine, chambres) constituerait un abus de bien social."},{code:"Code Général des Impôts",article:"Art. 145 & 216",title:"Régime Mère-Fille : Exonération à 95% des Dividendes Remontés en Holding",summary:"Permet de capitaliser les bénéfices excédentaires de Nell'Immo dans une société holding avec seulement 5% de quote-part imposable.",fullQuote:"Les produits nets des participations ouvrant droit à l'application du régime des sociétés mères sont retranchés du bénéfice net total de la société mère, défalcation faite d'une quote-part de frais et charges fixée à 5 % du produit total des participations.",officialSourceUrl:"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000038834771",practicalApplication:"Si Nell'Immo dégage un surplus de 10 000 € après la rémunération et le loyer de Nelly, ces fonds peuvent remonter dans une holding patrimoniale pour n'être taxés qu'à environ 1,25% d'IS effectif (5% x 25%), permettant d'acheter un studio étudiant pour ses filles.",urssafSafeguard:"La holding doit détenir au moins 5% du capital de la société fille pendant au moins deux ans."},{code:"Code de la Sécurité Sociale",article:"Art. L131-6",title:"Assujettissement des Dividendes de SARL aux Cotisations Sociales (Le Piège Évité par la SASU)",summary:"En SARL, les dividendes de gérant majoritaire dépassant 10% du capital social sont taxés à ~42% de cotisations TNS.",fullQuote:"Sont intégrés dans l'assiette des cotisations sociales des travailleurs indépendants non salariés les dividendes perçus par le travailleur indépendant, son conjoint ou le partenaire lié par un pacte civil de solidarité ou leurs enfants mineurs non émancipés, pour la part de ces revenus qui est supérieure à 10 % du capital social, des primes d'émission et des sommes versées en compte courant détenus en toute propriété ou en usufruit.",officialSourceUrl:"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037890696",practicalApplication:"Comme le capital de Nell'Immo est de 2 000 €, 10% ne représentent que 200 €. Si Nell'Immo était une SARL, Nelly paierait 42% d'URSSAF sur 29 800 € de dividendes (soit 12 500 € de charges) ! Grâce à la SASU, elle échappe à 100% à cette taxe.",urssafSafeguard:"C'est l'atout juridique numéro 1 du choix de la SASU pour Nell'Immo."},{code:"Code de la Sécurité Sociale",article:"Art. L311-3 23°",title:"Statut de Présidente de SASU : Assimilée Salariée au Régime Général",summary:"Le président de SASU relève obligatoirement du régime général de la sécurité sociale des salariés pour sa rémunération.",fullQuote:"Sont obligatoirement affiliées aux assurances sociales du régime général les présidents du conseil d'administration, les directeurs généraux et les directeurs généraux délégués des sociétés anonymes et les présidents et dirigeants des sociétés par actions simplifiées.",officialSourceUrl:"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000041469032",practicalApplication:"Nelly bénéficie de la même protection sociale et couverture maladie que les cadres salariés du secteur privé (régime général + retraite Agirc-Arrco), sans être soumise à l'assurance chômage Pôle Emploi.",urssafSafeguard:"Le bulletin de paie doit comporter l'ensemble des cotisations légales salariales et patronales (~75% du net)."},{code:"Code de Commerce",article:"Art. L410-2",title:"Pouvoir du Gouvernement de Bloquer les Prix de l'Énergie et des Produits de Première Nécessité par Décret",summary:"Base légale utilisée par LFI pour bloquer les prix de l'électricité, du gaz, des carburants et des fournitures scolaires sans vote du Parlement.",fullQuote:"Dans les secteurs ou les zones où la concurrence par les prix est limitée en raison soit de situations de monopole ou de difficultés durables d'approvisionnement, soit de dispositions législatives ou réglementaires, un décret en Conseil d'État peut réglementer les tarifs. Le gouvernement peut également prendre des mesures temporaires par décret en cas de hausse excessive des prix résultant d'une situation de crise.",officialSourceUrl:"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006424458",practicalApplication:"Ce texte permet à un gouvernement LFI de bloquer les factures d'énergie de la maison de 305k€ à Pélissanne dès l'été 2027 sans attendre une loi de finances.",urssafSafeguard:"Mesure limitée dans le temps (6 mois renouvelables) et susceptible de recours devant le Conseil d'État si l'indemnisation des producteurs (EDF) n'est pas prévue."},{code:"Constitution du 4 octobre 1958",article:"Article 49 alinéa 3",title:"Engagement de Responsabilité du Premier Ministre sur le Vote d'un Texte Financier",summary:"Mécanisme permettant de faire adopter le budget sans vote à l'Assemblée Nationale.",fullQuote:"Le Premier ministre peut, après délibération du conseil des ministres, engager la responsabilité du Gouvernement devant l'Assemblée nationale sur le vote d'un projet de loi de finances ou de financement de la sécurité sociale. Dans ce cas, ce projet est considéré comme adopté, sauf si une motion de censure, déposée dans les vingt-quatre heures qui suivent, est votée dans les conditions prévues à l'alinéa précédent.",officialSourceUrl:"https://www.legifrance.gouv.fr/loda/article_lc/LEGIARTI000019241062",practicalApplication:"Indispensable pour faire passer la réforme de l'IR à 14 tranches ou la baisse de TVA si le gouvernement LFI ou RN ne dispose que d'une majorité relative.",urssafSafeguard:"L'utilisation du 49.3 expose immédiatement à une motion de censure qui, si elle est votée par la majorité absolue des députés, entraîne la chute du gouvernement."},{code:"Constitution du 4 octobre 1958",article:"Article 55",title:"Primauté des Traités Internationaux et Conventions Fiscales sur la Loi Française",summary:"Empêche l'application unilatérale d'un « impôt universel sur la nationalité » par la France.",fullQuote:"Les traités ou accords régulièrement ratifiés ou approuvés ont, dès leur publication, une autorité supérieure à celle des lois, sous réserve, pour chaque accord ou traité, de son application par l'autre partie.",officialSourceUrl:"https://www.legifrance.gouv.fr/loda/article_lc/LEGIARTI000006527533",practicalApplication:"La France a signé plus de 120 conventions fiscales bilatérales basées sur la résidence fiscale. Tout citoyen français résidant à l'étranger peut faire annuler un impôt universel français en invoquant l'Art. 55.",urssafSafeguard:"Rend le modèle américain FATCA inapplicable en France sans renégociation unanime de l'ensemble des 120 conventions fiscales internationales."},{code:"Traité sur le Fonctionnement de l'UE",article:"Article 126 TFUE",title:"Procédure pour Déficit Excessif (PDE) et Règle d'Or des 3% du PIB",summary:"Mécanisme européen de surveillance et de sanctions budgétaires imposé à la France.",fullQuote:"Les États membres évitent les déficits publics excessifs. La Commission européenne examine le respect de la discipline budgétaire sur la base de deux critères : le rapport entre le déficit public prévu ou effectif et le produit intérieur brut (qui ne doit pas dépasser 3 %) et le rapport entre la dette publique et le PIB (qui ne doit pas dépasser 60 %). En cas de non-respect, le Conseil peut imposer des mesures correctives et des amendes financières.",officialSourceUrl:"https://eur-lex.europa.eu/legal-content/FR/TXT/?uri=CELEX:12012E126",practicalApplication:"La France étant déjà en déficit excessif (5,5% en 2024), les budgets de relance non financés de LFI ou RN déclencheraient des sanctions européennes immédiates et une flambée des taux d'intérêt souverains (Spread OAT).",urssafSafeguard:"Risque de gel des dotations de l'UE et obligation pour la France de mettre en œuvre des coupes budgétaires d'urgence."},{code:"Loi n° 70-9 du 2 janvier 1970",article:"Loi Hoguet",title:"Réglementation de l'Activité d'Agent Immobilier et Tenue des Registres Professionnels",summary:"Impose à Nell'Immo la détention de la carte professionnelle CPI, la garantie financière et la conservation sécurisée des mandats.",fullQuote:"Les dispositions de la présente loi s'appliquent aux personnes physiques ou morales qui, d'une manière habituelle, se livrent ou prêtent leur concours aux opérations portant sur les biens d'autrui et relatives à l'achat, la vente, la recherche, l'échange, la location ou sous-location en nu ou en meublé d'immeubles bâtis ou non bâtis. Elles doivent justifier d'une aptitude professionnelle, d'une garantie financière et d'un registre des mandats tenu sous forme reliée ou électronique infalsifiable.",officialSourceUrl:"https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000674220/",practicalApplication:"Nell'Immo dispose de la carte CPI 1310 2019 000 042 974. La loi impose à Nelly de conserver les dossiers et mandats pendant 10 ans, justifiant juridiquement les 35 m² de bureau et salle d'archives sous-loués dans sa maison de 305k€ à Pélissanne.",urssafSafeguard:"Justifie la réalité du besoin professionnel du local loué face à l'URSSAF (espace de stockage d'archives obligatoire non substituable par un simple meuble de salon)."},{code:"Loi n° 2021-1104 du 22 août 2021",article:"Loi Climat & Résilience (Art. 160)",title:"Calendrier d'Interdiction de Louer des Passoires Thermiques (DPE G, F, E)",summary:"Interdiction progressive de mise en location des logements énergivores en France.",fullQuote:"À compter du 1er janvier 2025 pour les logements de classe G, du 1er janvier 2028 pour les logements de classe F et du 1er janvier 2034 pour les logements de classe E, le niveau de performance énergétique minimal requis pour la décence d'un logement loué à usage d'habitation principale est renforcé.",officialSourceUrl:"https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000043956924",practicalApplication:"Ce calendrier force les propriétaires bailleurs de passoires thermiques à Pélissanne à vendre avec une décote de 10% à 15%, générant des opportunités d'estimation et de mandats exclusifs pour Nell'Immo. Le RN propose un moratoire de 5 ans.",urssafSafeguard:"Obligation de fournir un audit énergétique complet pour tout logement classé F ou G proposé à la vente dès le compromis."},{code:"BOSS & Arrêté du 25 février 2025",article:"Avantages en Nature Véhicules & Énergie",title:"Réglementation des Voitures de Fonction en Leasing et Bornes de Recharge à Domicile",summary:"Règles d'évaluation des avantages en nature pour les véhicules hybrides, thermiques et 100% électriques.",fullQuote:"Pour les véhicules thermiques ou hybrides mis à disposition depuis février 2025, l'évaluation forfaitaire de l'avantage en nature en location est portée à 50 % du coût global annuel TTC (67 % si le carburant est pris en charge). Pour les véhicules 100 % électriques satisfaisant au score environnemental, un abattement de 70 % est appliqué sur l'avantage en nature.",officialSourceUrl:"https://www.boss.gouv.fr/portail/accueil/avantages-en-nature-et-frais-pro.html",practicalApplication:"Si Nell'Immo passe son leasing sur un modèle 100% électrique éligible, l'avantage en nature taxable de Nelly baisse de 70%, et la borne de recharge installée dans la maison de 305 000 € est payée à 100% par Nell'Immo sans avantage en nature taxable.",urssafSafeguard:"La borne doit rester la propriété de la société et être inscrite à l'actif de Nell'Immo si elle est amortie."},{code:"Conseil Constitutionnel",article:"Décision n° 2012-662 DC",title:"Plafond Constitutionnel de Non-Confiscation et Censure des Taux Marginaux Excessifs",summary:"Le Conseil constitutionnel censure tout barème d'imposition dont le taux marginal cumulé excède le seuil de confiscation (~66-70%).",fullQuote:"Considérant qu'en vertu de l'article 13 de la Déclaration de 1789, la contribution commune doit être également répartie entre tous les citoyens, en raison de leurs facultés ; que cette exigence ne serait pas respectée si l'impôt revêtait un caractère confiscatoire ou faisait peser sur une catégorie de contribuables une charge excessive au regard de leurs facultés contributives.",officialSourceUrl:"https://www.conseil-constitutionnel.fr/decision/2012/2012662DC.htm",practicalApplication:"La tranche d'IR à 90% proposée par LFI/NFP sur les revenus supérieurs à 400 000 € encourt une inconstitutionnalité certaine dès sa transmission au Conseil constitutionnel, protégeant les cadres et entrepreneurs contre des taux marginaux confiscatoires.",urssafSafeguard:"Jurisprudence constante limitant le cumul IR + prélèvements sociaux à un plafond effectif d'environ 66% à 70% des revenus."},{code:"Cour des Comptes",article:"Rapport Public 2024 / 2025",title:"Alerte sur la Trajectoire des Finances Publiques et la Soutenabilité de la Dette (3 228 Mds€)",summary:"Rapport annuel constatant le dérapage du déficit à 5,5% du PIB et l'impératif de réformes structurelles.",fullQuote:"La situation des finances publiques de la France demeure très dégradée. Avec un déficit public supérieur aux prévisions et une dette atteignant 112 % du PIB, la France s'expose à un renchérissement du coût de sa dette et à la mise en œuvre de la procédure européenne de déficit excessif.",officialSourceUrl:"https://www.ccomptes.fr/fr/publications/le-rapport-public-annuel-2024",practicalApplication:"Ce rapport indépendant démontre que les promesses non gagées de dépenses massives (LFI à 280 Mds€, RN avec baisse de TVA à 12 Mds€) provoqueront une mise sous tutelle budgétaire européenne et une flambée des taux d'emprunt pénalisant le crédit immobilier à Pélissanne.",urssafSafeguard:"Document de référence opposable lors des débats budgétaires parlementaires sur la loi de finances."},{code:"Code du Travail",article:"Art. L. 7233-4 (ex-L129-13)",title:"Aide Financière de l'Entreprise aux Services à la Personne (CESU Dirigeant)",summary:"Encadrement du Chèque Emploi Service Universel préfinancé par l'entreprise au bénéfice de ses salariés et de son dirigeant.",fullQuote:"L'aide financière accordée par le comité social et économique ou par l'entreprise au bénéfice des salariés ou des dirigeants pour le financement de services à la personne est exonérée d'impôt sur le revenu et de toute cotisation de sécurité sociale dans la limite d'un plafond annuel revalorisé.",officialSourceUrl:"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000033010461",practicalApplication:"Permet à Nell'Immo de prendre en charge légalement 2 591 €/an de dépenses familiales (cours de piano de l'aînée, ménage) pour Nelly avec 25% de crédit d'impôt société supplémentaire (Art. 244 quater F CGI).",urssafSafeguard:"Respect strict du plafond annuel de 2 591 € par bénéficiaire et formalisation de la décision d'attribution."}];function An(o){if(!o)return;const m=o.trim().toLower au régime actuel, mais protection contre la surtaxe.",riskOrDrawback:"Aucun allègement supplémentaire sur les dividendes par rapport à 2024."}},{category:"Fiscalité & Capital",title:"Barème de l'Impôt sur le Revenu & Quotient Familial",lfiProposal:{measure:"Création d'un barème progressif à 14 tranches (de 0% à 90%) et remplacement du quotient familial par un crédit d'impôt forfaitaire universel par enfant.",legalInstrument:"Loi de Finances Initiale",programSource:"Programme NFP Juin 2024 & Proposition de Loi LFI n° 1248 (Assemblée Nationale)",feasibilityProbability:"Moyenne (50-70%)",feasibilityExplanation:"Projet emblématique de la gauche mais contesté par le Conseil constitutionnel si les tranches marginales supérieures dépassent le seuil confiscatoire (~66-70%).",whyAndHow:"Lisser la progressivité de l'IR pour alléger les revenus en dessous de 4 000 €/mois et surtaxer fortement les hauts patrimoines au-delà de 100 000 €/an.",concreteEuroImpactNelly:"Sur son salaire net de 40 000 €, l'IR reste modéré (taux moyen d'environ 6% à 8%). Avec le crédit d'impôt enfants, l'IR est d'environ 2 500 €.",riskOrDrawback:"Disparition du mécanisme traditionnel du quotient familial qui profitait aux classes moyennes supérieures."},rnProposal:{measure:"Maintien des 5 tranches actuelles, mais octroi d'une part fiscale pleine dès le 2e enfant (au lieu d'une demi-part), et exonération totale d'IR pour les moins de 30 ans.",legalInstrument:"Loi de Finances Initiale",programSource:"Programme RN « 22 mesures 2022-2027 » (Mesure n°4) & Amendements PLF 2024-2026",feasibilityProbability:"Haute (>85%)",feasibilityExplanation:"Mesure populaire et consensuelle auprès de toutes les oppositions de droite. Faisable dès le premier budget.",whyAndHow:"Politique nataliste : récompenser financièrement les familles ayant au moins 2 enfants pour redresser la démographie française.",concreteEuroImpactNelly:"Comme Nelly a 2 filles en garde alternée, le 2e enfant passe de 0,25 part à 0,50 part : son foyer fiscal passe de 1,75 à 2,00 parts (ou 2,25 parts avec Case T), soit une baisse d'IR de ~300 € à 500 €/an.",riskOrDrawback:"Coût budgétaire élevé pour l'État (estimé à 3 Mds€), risquant d'accroître le déficit public."}},{category:"Fiscalité & Capital",title:"Taxation des Ultra-Riches, ISF & Risque d'Exil Fiscal",lfiProposal:{measure:"Rétablissement de l'ISF renforcé avec volet climatique (taux progressif jusqu'à 2% ou 3% sur les patrimoines nets > 1,3 M€), « impôt universel » basé sur la nationalité (modèle FATCA) et Exit Tax renforcée sur 10 ans.",legalInstrument:"Loi de Finances Initiale (Art. 34 Constitution) & Renégociation de conventions",programSource:"Programme NFP Juin 2024 (Mesure n°19) & Livret Fiscalité LFI",feasibilityProbability:"Conditionnelle (<40%)",feasibilityExplanation:"Le rétablissement de l'ISF est réalisable par simple loi de finances, mais l'impôt universel sur la nationalité est bloqué par l'Article 55 de la Constitution (120 conventions fiscales bilatérales fondées sur la résidence). L'Exit Tax excessive est limitée par la CJUE.",whyAndHow:"Faire contribuer les 1% et 0,1% les plus fortunés au financement de la transition écologique et des services publics, tout en prétendant neutraliser l'exil fiscal par un passeport fiscal extraterritorial.",concreteEuroImpactNelly:"La maison de 305 000 € de Nelly et son agence sont totalement exonérées de l'ISF (seuil d'entrée à 1,3 M€). En revanche, effet indirect majeur : assèchement des investisseurs locatifs privés à Pélissanne (-25% de mandats) et risque de report de la pression fiscale sur sa tranche (70k€).",riskOrDrawback:"Exil réel des capitaux financiers très liquides (2 à 3 Mds€/an d'actifs selon France Stratégie) et blocage juridique international de l'impôt universel."},rnProposal:{measure:"Remplacement de l'IFI (Impôt sur la Fortune Immobilière) par l'IFF (Impôt sur la Fortune Financière) : exonération intégrale de la résidence principale et de l'immobilier d'habitation, taxation ciblée de la spéculation financière.",legalInstrument:"Loi de Finances Initiale",programSource:"Programme RN 2022-2027 (Mesure n°5) & Livret Fiscalité Marine Le Pen",feasibilityProbability:"Haute (>85%)",feasibilityExplanation:"Modification classique de l'assiette fiscale du patrimoine réalisable par une majorité parlementaire de droite.",whyAndHow:"Le RN veut sanctuariser la pierre et la transmission des maisons familiales françaises en déplaçant l'impôt sur les seuls portefeuilles d'actions et placements financiers.",concreteEuroImpactNelly:"Exonération totale pour son patrimoine immobilier (maison 305k€). Incite les épargnants fortunés de la région d'Aix à acheter de l'immobilier plutôt que des actions, stimulant temporairement la demande pour Nell'Immo.",riskOrDrawback:"Risque de fuite des capitaux financiers hors de France (actions d'entreprises françaises vendues au profit de paradis fiscaux) et déficit budgétaire accru."}},{category:"Fiscalité & Capital",title:"Équilibre Budgétaire Global, Déficit Public & Contraintes UE",lfiProposal:{measure:"Plan de 152 Mds€ de dépenses sur 3 ans (puis 233 Mds€ selon Montaigne) compensé par une surtaxe des hauts patrimoines, superprofits et multinationales, avec rupture assumée avec le Pacte de Stabilité européen des 3%.",legalInstrument:"Loi de Programmation des Finances Publiques & PLF",programSource:"Contrat de Législature NFP 2024 & Rapport de chiffrage officiel",feasibilityProbability:"Moyenne (50-70%)",feasibilityExplanation:"L'Institut Montaigne et l'OFCE évaluent le déficit net supplémentaire entre 60 et 179 Mds€/an en raison de recettes réelles inférieures aux prévisions (54 Mds€ constatées).",whyAndHow:"La doctrine néo-keynésienne de LFI postule que l'injection massive de liquidités par la demande (salaires, services gratuits) crée un multiplicateur budgétaire générant plus de recettes que de coûts.",concreteEuroImpactNelly:"Gain immédiat en services gratuits (+3 587 €/an sur les 2 filles), mais risque de tension sur la dette publique française : le Spread OAT s'élargit, faisant monter les taux d'emprunt immobilier à 4,20% (+170 €/mois sur une maison de 305k€).",riskOrDrawback:"Risque d'escalade de la Procédure de Déficit Excessif ouverte par Bruxelles et dégradation de la note souveraine de la France."},rnProposal:{measure:"Plan de 85 Mds€ de baisses d'impôts et dépenses (TVA 5,5% énergie, exonération IR -30 ans) financé théoriquement par 15 à 20 Mds€ d'économies sur l'immigration et 2 Mds€ de baisse de contribution à l'UE.",legalInstrument:"Loi de Finances Rectificative (PLFR)",programSource:"Plan de Redressement RN & Chiffrages Jordan Bardella 2024-2026",feasibilityProbability:"Moyenne (50-70%)",feasibilityExplanation:"L'Institut Montaigne et la Cour des Comptes chiffrent le déficit net à +71 Mds€/an car l'AME ne coûte qu'1,2 Md€ et la préférence nationale sur les prestations sociales est inconstitutionnelle.",whyAndHow:"Le RN veut redonner du pouvoir d'achat par la baisse directe des prix de l'énergie sans toucher à la fiscalité des entreprises privées ni des ménages aisés.",concreteEuroImpactNelly:"Gain immédiat de +650 € sur l'énergie et +500 € sur l'IR, mais risque financier très violent : les marchés financiers anticipent une crise de la dette souveraine avec un Spread OAT bondissant à 110 bps, portant les taux de prêt à 4,65% (-17% de capacité d'emprunt pour les clients de Nell'Immo).",riskOrDrawback:"Déficit public non financé risquant de déclencher un blocage du marché immobilier par le crédit bancaire."}},{category:"Vie Quotidienne & Enfants",title:"Cantine Scolaire, Fournitures & Garderie (2 Filles)",lfiProposal:{measure:"Gratuité totale de la cantine scolaire, du ramassage périscolaire et distribution gratuite d'un kit complet de fournitures scolaires pour tous les élèves sans condition de ressources.",legalInstrument:"Loi d'orientation sur l'école républicaine + dotations d'État aux communes",programSource:"Programme NFP Juin 2024 (Mesure n°29) & Rapport d'application Ville de Saint-Denis Rentrée 2026",feasibilityProbability:"Haute (>85%)",feasibilityExplanation:"Déjà testé et validé juridiquement dans plusieurs dizaines de communes de gauche (Saint-Denis, Pierrefitte, Vénissieux, Villeurbanne) sans obstacle constitutionnel.",whyAndHow:"Sanctuariser le droit à l'éducation gratuite pour neutraliser le coût de la rentrée pour toutes les familles, quel que soit leur quotient CAF.",concreteEuroImpactNelly:"Économie directe de +1 040 € / an à Pélissanne (cantine primaire Cadette 287 € + cantine collège Aînée 490 € + fournitures 260 € = 1 037 € d'économie nette).",riskOrDrawback:"Risque de saturation des cantines et nécessité pour la commune d'embaucher plus de personnel périscolaire."},rnProposal:{measure:"Maintien des tarifs communaux actuels de cantine et de garderie. Priorité donnée au contrôle d'accès et à l'approvisionnement 100% français/local.",legalInstrument:"Autonomie des collectivités territoriales (Code Général des Collectivités Territoriales)",programSource:"Livret Collectivités Locales RN & Délibérations mairies de Fréjus, Beaucaire, Hayange",feasibilityProbability:"Haute (>85%)",feasibilityExplanation:"Application immédiate par les municipalités sans coût additionnel pour l'État.",whyAndHow:"Le RN refuse la gratuité universelle, estimant que les familles doivent contribuer au coût réel des repas pour ne pas surcharger les contribuables locaux.",concreteEuroImpactNelly:"Économie nulle (0 €) sur la cantine : Nelly continue de payer le tarif haut de la tranche 5 à Pélissanne (4,10 €/repas) soit ~780 €/an + 240 € de fournitures.",riskOrDrawback:"Hausse potentielle des tarifs périscolaires si les dotations de l'État aux communes baissent."}},{category:"Vie Quotidienne & Enfants",title:"Santé, Orthodontie (11 ans) & Pratique Musicale/Sportive",lfiProposal:{measure:"Instauration du « 100% Sécu » (remboursement intégral de l'orthodontie des ados, de l'optique et des soins dentaires sans mutuelle privée) + Chèque culture & sport universel.",legalInstrument:"Projet de Loi de Financement de la Sécurité Sociale (PLFSS)",programSource:"L'Avenir en Commun (Livret Santé) & Contrat de Législature NFP",feasibilityProbability:"Moyenne (50-70%)",feasibilityExplanation:"Réforme structurelle colossale de l'Assurance Maladie nécessitant le redéploiement des cotisations des mutuelles privées vers la Sécurité Sociale.",whyAndHow:"Supprimer les frais de gestion des complémentaires privées pour rembourser directement 100% des soins essentiels des enfants.",concreteEuroImpactNelly:"Économie nette de +1 250 € / an sur l'orthodontie et la mutuelle de sa fille de 11 ans + 520 € sur le piano et le sport = +1 770 € / an de pouvoir d'achat.",riskOrDrawback:"Délai d'attente potentiel accru chez les orthodontistes conventionnés secteur 1."},rnProposal:{measure:"Maintien du système dual Sécurité Sociale + Mutuelle privée. Baisse de la TVA à 5,5% sur les équipements sportifs et instruments de musique.",legalInstrument:"Loi de Finances Initiale",programSource:"Programme RN 2022-2027 (Livret Santé & Pouvoir d'achat p. 11)",feasibilityProbability:"Haute (>85%)",feasibilityExplanation:"Ne bouscule pas l'architecture de santé existante et s'appuie sur une simple baisse de taux de TVA sectorielle.",whyAndHow:"Le RN privilégie l'incitation fiscale par la TVA plutôt que l'étatisation de la couverture santé complémentaire.",concreteEuroImpactNelly:"Économie modeste sur les fournitures et instruments (-120 €/an), mais reste à charge orthodontie inchangé (~700 €/an à la charge de Nelly et de sa mutuelle).",riskOrDrawback:"Baisse fréquente des subventions aux associations musicales et culturelles dans les municipalités RN, renchérissant le coût des cours de piano."}},{category:"Immobilier & Agence Nell'Immo",title:"Régulation Locative (DPE, Loyers) & Taux d'Emprunt Bancaire",lfiProposal:{measure:"Encadrement généralisé des loyers, interdiction des expulsions locatives sans relogement et mise en place de la Garantie Universelle des Loyers (GUL).",legalInstrument:"Loi d'urgence pour le logement",programSource:"Contrat de Législature NFP (Chapitre Logement) & Livret LFI Logement",feasibilityProbability:"Haute (>85%)",feasibilityExplanation:"L'encadrement des loyers s'applique par arrêté préfectoral rapide (déjà actif à Paris, Lille, Lyon, Montpellier, Bordeaux).",whyAndHow:"Enrayer la spéculation immobilière et protéger les locataires contre la hausse excessive des quittances.",concreteEuroImpactNelly:"Impact agence Nell'Immo : -10% sur les ventes d'investissement locatif privé, mais compensation immédiate par la gestion locative sous GUL (+14 400 € HT/an).",riskOrDrawback:"Attentisme des investisseurs bailleurs privés à Pélissanne et Salon-de-Provence."},rnProposal:{measure:"Abrogation ou moratoire de 5 ans sur les interdictions de louer liées au DPE (passoires thermiques G et F autorisées à la location), refus d'encadrement des loyers.",legalInstrument:"Proposition de Loi de simplification du logement (abrogation partielle Loi Climat)",programSource:"Amendements RN n° CE356 Loi Climat & Résilience et Déclarations officielles groupe RN 2024-2026",feasibilityProbability:"Haute (>85%)",feasibilityExplanation:"Soutenu par la droite républicaine et les fédérations immobilières (FNAIM, UNIS). Majorité parlementaire très probable sur ce point.",whyAndHow:"Remettre sur le marché les 1,5 million de logements menacés d'interdiction de louer pour débloquer la crise du logement locatif.",concreteEuroImpactNelly:"Opportunité immédiate pour Nell'Immo : +10% à +15% de mandats de vente libérés sur les maisons anciennes de Pélissanne.",riskOrDrawback:"Risque macroéconomique de spread OAT : si la dette souveraine se tend, les taux de crédit bancaire montent à 4,2-4,5%, faisant perdre 10% de capacité d'emprunt aux acquéreurs de Nell'Immo."}},{category:"Immobilier & Agence Nell'Immo",title:"TVA Énergie, Carburants & Factures du Foyer",lfiProposal:{measure:"Gratuité des premiers mètres cubes d'eau vitaux, blocage des prix de l'électricité et du gaz par décret, sortie du marché européen de l'énergie.",legalInstrument:"Décret présidentiel / ministériel (Code de l'énergie Art. L410-2)",programSource:"Programme NFP Juin 2024 (Mesure n°2) & Livret Énergie LFI",feasibilityProbability:"Moyenne (50-70%)",feasibilityExplanation:"Le blocage des prix par décret est juridiquement possible en situation de crise, mais la sortie des règles européennes de concurrence expose à un contentieux avec Bruxelles.",whyAndHow:"Faire baisser les tarifs au niveau du coût réel de production du parc nucléaire et hydraulique français (~45-50 €/MWh).",concreteEuroImpactNelly:"Économie annuelle de +750 € sur l'électricité, la climatisation réversible et l'eau de la maison de 305k€ à Pélissanne.",riskOrDrawback:"Risque de déficit des opérateurs publics (EDF) si l'État ne compense pas intégralement le gel tarifaire."},rnProposal:{measure:"Baisse immédiate et pérenne du taux de TVA de 20% à 5,5% sur tous les produits énergétiques : électricité, gaz, fioul et carburants automobiles.",legalInstrument:"Loi de Finances Rectificative (PLFR) adoptée en session extraordinaire",programSource:"Programme RN « 22 mesures » (Mesure n°1) & Proposition de Loi RN n° 29 Assemblée Nationale",feasibilityProbability:"Haute (>85%)",feasibilityExplanation:"Mesure prioritaire n°1 affichée par Jordan Bardella pour l'été 2027. Dérogations fiscales sur l'énergie autorisées par la directive européenne TVA révisée.",whyAndHow:"Rendre du pouvoir d'achat direct aux ménages et aux entreprises dépendantes de la voiture pour leurs déplacements professionnels.",concreteEuroImpactNelly:"Économie de +650 €/an sur l'électricité de la maison de 305k€ + économie directe sur le carburant du véhicule de fonction de Nell'Immo.",riskOrDrawback:"Coût colossal pour le budget de l'État (estimé à 12 à 15 Mds€/an) sans recette de compensation identifiée."}},{category:"Transmission & Retraite",title:"Donation Maison 305k€ & Droits de Succession aux 2 Filles",lfiProposal:{measure:"Plafonnement des très gros héritages (héritage maximum au-delà de 12 millions d'euros), maintien de l'abattement légal de 100 000 € par enfant pour les patrimoines moyens.",legalInstrument:"Loi de Finances Initiale",programSource:"L'Avenir en Commun (Livret Fiscalité) & Programme NFP Juin 2024",feasibilityProbability:"Moyenne (50-70%)",feasibilityExplanation:"Le plafonnement absolu à 100% au-delà d'un seuil a été jugé inconstitutionnel par le Conseil Constitutionnel (droit de propriété) ; une surtaxe progressive reste toutefois possible.",whyAndHow:"Combattre la concentration dynastique des méga-patrimoines tout en protégeant les résidences familiales des classes moyennes.",concreteEuroImpactNelly:"0 € de droits de succession pour ses 2 filles : en donnant la nue-propriété (Art. 669 CGI), la valeur transmise n'est que de 61 000 €/fille, bien sous les 100 000 €.",riskOrDrawback:"Aucun risque pour la maison de 305 000 € de Nelly. Risque uniquement pour les patrimoines supérieurs à 1 million d'euros."},rnProposal:{measure:"Exonération des donations et successions jusqu'à 100 000 € par enfant tous les 10 ans (au lieu de 15 ans) et exonération des donations de grands-parents jusqu'à 50 000 €.",legalInstrument:"Loi de Finances Initiale",programSource:"Programme RN « 22 mesures » (Mesure n°10) & Amendements PLF 2025",feasibilityProbability:"Haute (>85%)",feasibilityExplanation:"Mesure de transmission patrimoniale très consensuelle à l'Assemblée Nationale.",whyAndHow:"Faciliter la transmission du patrimoine entre générations de son vivant pour aider les jeunes à s'installer plus tôt.",concreteEuroImpactNelly:"0 € de droits de mutation. Permet en outre à Nelly de renouveler une donation défiscalisée tous les 10 ans au lieu de 15 ans si son patrimoine s'accroît.",riskOrDrawback:"Favorise davantage les patrimoines détenant plusieurs biens immobiliers."}},{category:"Transmission & Retraite",title:"Âge Légal de Départ à la Retraite & Annuités",lfiProposal:{measure:"Abrogation immédiate de la loi de 2023 et rétablissement de la retraite à 60 ans à taux plein avec 40 annuités de cotisation.",legalInstrument:"Loi ordinaire d'abrogation dès l'été 2027",programSource:"Programme NFP Juin 2024 (Mesure prioritaire n°1) & Proposition d'abrogation déposée à l'AN",feasibilityProbability:"Haute (>85%)",feasibilityExplanation:"Une majorité parlementaire d'abrogation existe potentiellement à l'Assemblée Nationale (gauche + RN opposés aux 64 ans).",whyAndHow:"Permettre aux actifs de profiter de leur retraite en bonne santé et libérer des emplois pour les jeunes.",concreteEuroImpactNelly:"Gain financier et personnel massif : Nelly peut liquider sa retraite 4 ans plus tôt (à 60 ans au lieu de 64 ans), touchant 4 années supplémentaires de pension (environ +100 800 € cumulés).",riskOrDrawback:"Nécessite de financer le déficit du régime des retraites par des cotisations sur les hauts salaires et les dividendes."},rnProposal:{measure:"Retraite à 60 ans réservée uniquement aux personnes ayant commencé à travailler avant 20 ans avec 40 annuités. Pour les autres, départ progressif entre 62 et 63 ans.",legalInstrument:"Loi de réforme des retraites",programSource:"Programme RN 2022-2027 (Déclarations Jordan Bardella Juin 2024) & Fiche Retraite RN",feasibilityProbability:"Moyenne (50-70%)",feasibilityExplanation:"Le coût de retour partiel à 60/62 ans impose un étalement dans le temps sous contrainte des règles budgétaires européennes.",whyAndHow:"Récompenser prioritairement les carrières longues et pénibles ayant débuté jeunes dans l'artisanat ou l'industrie.",concreteEuroImpactNelly:"Comme Nelly est dirigeante d'entreprise ayant fait des études supérieures, elle ne relève pas des carrières longues précoces : son âge de départ se situerait à 62-63 ans (gain de 1 à 2 ans par rapport à la loi actuelle).",riskOrDrawback:"Flou persistant sur l'âge exact de départ pour les professions indépendantes et gérants de société."}},{category:"Vie Quotidienne & Enfants",title:"Financement des Études Supérieures des Filles (2033 & 2039)",lfiProposal:{measure:"Allocation d'autonomie universelle de 1 063 € net par mois versée directement à chaque jeune dès 18 ans, repas CROUS à 1 € pour tous et gratuité intégrale des droits d'inscription universitaire.",legalInstrument:"Loi de programmation pour la jeunesse et l'enseignement supérieur",programSource:"Programme NFP Juin 2024 (Mesure n°28) & Livret LFI Jeunesse",feasibilityProbability:"Moyenne (50-70%)",feasibilityExplanation:"Coût annuel évalué à 10 Mds€. Faisable si le budget global est adopté, mais risque de rabotage des montants sous contrainte budgétaire.",whyAndHow:"Garantir l'indépendance financière des étudiants sans dépendre du revenu parental et éradiquer la précarité étudiante.",concreteEuroImpactNelly:"Gain financier colossal pour Nelly : +12 756 € / an par fille à partir de ses 18 ans (soit +25 512 € / an d'économie de cash quand les 2 filles seront en études). Nelly n'a pas à payer de loyer étudiant sur ses dividendes.",riskOrDrawback:"Risque de saturation des filières universitaires et d'augmentation de la sélection d'entrée."},rnProposal:{measure:"Maintien des bourses d'État sur critères sociaux actuels et de mérite, réservées prioritairement aux familles modestes de nationalité française. Refus de toute allocation universelle.",legalInstrument:"Loi de Finances Initiale",programSource:"Programme RN 2022-2027 (Livret Enseignement Supérieur & Jeunesse)",feasibilityProbability:"Haute (>85%)",feasibilityExplanation:"Statu quo budgétaire sur les bourses d'État sans création de nouvelle dépense publique massive.",whyAndHow:"Le RN estime que les parents ayant des revenus confortables (70 000 €) doivent assumer intégralement la subsistance de leurs enfants majeurs.",concreteEuroImpactNelly:"0 € d'aide de l'État. En tant que dirigeante gagnant 70 000 €, Nelly dépasse tous les plafonds de bourse CROUS. Elle devra financer elle-même les logements étudiants à Aix ou sibilityExplanation:"Le modèle libéral d'intermédiation est la règle en vigueur. Aucune remise en cause.",whyAndHow:"Protéger les agences indépendantes et le réseau des commerçants de proximité face à l'ingérence administrative de l'État.",concreteEuroImpactNelly:"Totale liberté commerciale pour Nell'Immo : Nelly conserve la maîtrise de son barème d'honoraires (3,0% ou 3,5% sur mandat exclusif, 4,5% sur mandat simple) sans contrainte réglementaire.",riskOrDrawback:"Concurrence féroce maintenue entre agences traditionnelles et réseaux de mandataires indépendants à bas coûts."}},{category:"Immobilier & Agence Nell'Immo",title:"Coût Salarial si Recrutement dans l'Agence (Négociateur / Assistant)",lfiProposal:{measure:"Revalorisation immédiate du SMIC à 1 600 € net (environ 2 090 € brut) et suppression progressive des allègements généraux de cotisations patronales (« allègements Fillon ») au-delà de 1,2 SMIC.",legalInstrument:"Décret du Ministère du Travail (Art. L. 3231-2 C. trav.) et Loi de Finances de la Sécurité Sociale (PLFSS)",programSource:"Programme NFP Juin 2024 (Mesure n°3) & Livret Travail LFI",feasibilityProbability:"Haute (>85%)",feasibilityExplanation:"Le SMIC net peut être relevé par simple décret en Conseil des ministres dès les 15 premiers jours de mandat sans vote du Parlement.",whyAndHow:"Permettre aux salariés de vivre dignement de leur travail face à l'inflation et forcer le partage de la valeur ajoutée dans les entreprises.",concreteEuroImpactNelly:"Si Nell'Immo souhaite embaucher un(e) assistant(e) ou un négociateur salarié junior : le coût annuel employeur passe d'environ 26 000 € à 31 500 € (+5 500 € / an de charges salariales pour Nell'Immo). Incite Nelly à travailler seule ou avec des agents commerciaux indépendants sous statut mandataire (RSAC).",riskOrDrawback:"Frein direct à l'embauche de salariés pour les TPE unipersonnelles comme Nell'Immo."},rnProposal:{measure:"Dispositif « Hausse de 10% des salaires sans cotisations patronales » : exonération totale de cotisations patronales pendant 5 ans sur toute augmentation de salaire jusqu'à 3 SMIC, sans hausse imposée du SMIC légal.",legalInstrument:"Loi de relance économique d'urgence",programSource:"Programme RN « 22 mesures » (Mesure n°2) & Déclarations Jordan Bardella",feasibilityProbability:"Moyenne (50-70%)",feasibilityExplanation:"Le Conseil constitutionnel surveille les ruptures d'égalité devant l'impôt sur les exonérations ciblées sans contrepartie.",whyAndHow:"Inciter les patrons de PME/TPE à augmenter les salaires par la baisse de charges plutôt que par une hausse obligatoire du SMIC.",concreteEuroImpactNelly:"Si Nell'Immo rémunère un collaborateur ou un jeune de moins de 30 ans : exonération d'IR pour le salarié et souplesse sur les cotisations patronales. Moins de pression financière sur la masse salariale de l'agence.",riskOrDrawback:"Aucune garantie de hausse de pouvoir d'achat pour les salariés si l'employeur ne choisit pas d'augmenter volontairement."}},{category:"Vie Quotidienne & Enfants",title:"Subventions Locales Culture & Sport (Piano 400 € & Escalade 400 €)",lfiProposal:{measure:"Plan d'urgence pour la culture et le sport associatif : sanctuarisation des dotations aux collectivités territoriales, chèque culture & sport de 150 € à 200 € par enfant et péréquation républicaine.",legalInstrument:"Loi de Finances Initiale (Mission Culture & Jeunesse)",programSource:"Programme NFP Juin 2024 & Livret Sport et Culture Populaire LFI",feasibilityProbability:"Haute (>85%)",feasibilityExplanation:"Financement par les dotations globales de fonctionnement (DGF) réorientées vers les communes.",whyAndHow:"Garantir l'accès universel à la pratique artistique (piano, musique) et sportive pour tous les enfants.",concreteEuroImpactNelly:"Les tarifs de l'École Municipale de Musique de Pélissanne et du club d'escalade restent modérés et subventionnés (-150 € à -200 € d'économie par fille grâce au chèque culture/sport).",riskOrDrawback:"Centralisation accrue des critères d'attribution des subventions associatives."},rnProposal:{measure:"Baisse drastique des subventions aux associations culturelles et artistiques jugées non prioritaires au niveau municipal et départemental, réorientation vers la sécurité et la police municipale.",legalInstrument:"Délibérations budgétaires des communes et des départements",programSource:"Audit des politiques culturelles dans les municipalités RN (Rapports Cour des Comptes & Observatoire de la liberté de création : Fréjus, Hayange, Beaucaire, Perpignan)",feasibilityProbability:"Haute (>85%)",feasibilityExplanation:"Pouvoir discrétionnaire total des maires et conseils départementaux sur l'attribution des subventions aux associations locales.",whyAndHow:"Le RN estime que les activités culturelles spécialisées doivent être financées par leurs usagers directs et non par les impôts locaux de tous les contribuables.",concreteEuroImpactNelly:"Effet pervers réel constaté sur le terrain : si les subventions de l'école de musique ou du club d'escalade sont coupées, les structures répercutent le coût sur les familles. Le cours de piano de l'aînée risque de passer de 400 € à 650 € - 750 € / an (+250 € à +350 € de reste à charge pour Nelly).",riskOrDrawback:"Augmentation directe du coût des activités extrascolaires pour les familles de la classe moyenne."}},{category:"Vie Quotidienne & Enfants",title:"Allocations Familiales & Universalité en Garde Alternée",lfiProposal:{measure:"Revalorisation de 10% des allocations familiales, création d'une allocation universelle dès le 1er enfant, maintien du principe de modulation progressive selon le revenu familial.",legalInstrument:"Projet de Loi de Financement de la Sécurité Sociale (PLFSS)",programSource:"Programme NFP Juin 2024 (Mesure n°26) & Livret Famille LFI",feasibilityProbability:"Haute (>85%)",feasibilityExplanation:"Mesure classique de politique familiale relevant de la branche Famille de la Sécurité Sociale (CNAF).",whyAndHow:"Soutenir le niveau de  Commun & Cadre de Vie",title:"Écoles de Pélissanne, Canicules & Gestion de l'Eau (Touloubre)",lfiProposal:{measure:"Plan « Urgence Canicule Écoles » : rénovation thermique et climatisation éco-responsable des bâtiments scolaires dans le Sud, limitation à 20 élèves par classe en élémentaire, et sanctuarisation de la gestion publique de l'eau face aux sécheresses et crues de la Touloubre.",legalInstrument:"Plan de bifurcation écologique de 200 Mds€ & Dotations d'équipement des territoires ruraux (DETR)",programSource:"Programme NFP Juin 2024 (Mesures n°31 & 35) & Livret Eau LFI",feasibilityProbability:"Moyenne (50-70%)",feasibilityExplanation:"Nécessite la mobilisation des banques publiques (Banque des Territoires / Caisse des Dépôts) pour financer les travaux communaux.",whyAndHow:"Protéger la santé des enfants en classe face aux canicules récurrentes à Pélissanne (40°C en juin-septembre) et sécuriser la ressource en eau potable provençale.",concreteEuroImpactNelly:"Sa fille de 5 ans et son aînée de 11 ans étudient dans des classes tempérées et isolées (écoles Victor Hugo, Roux de Brignoles, Collège Roger Carcassonne) plutôt que dans des bâtiments étouffants.",riskOrDrawback:"Pression fiscale accrue sur les hauts patrimoines pour financer le fonds vert d'État."},rnProposal:{measure:"Refus des normes écologiques européennes contraignantes, moratoire sur les interdictions DPE, soutien direct aux communes pour l'entretien des cours d'eau et bassins de rétention contre les inondations, et relance massive du nucléaire.",legalInstrument:"Loi de simplification des normes environnementales",programSource:"Programme RN Écologie de terroir & Amendements Loi Climat",feasibilityProbability:"Haute (>85%)",feasibilityExplanation:"Forte convergence avec les maires ruraux et les fédérations du BTP pour alléger les contraintes réglementaires.",whyAndHow:"Protéger le pouvoir d'achat des ménages contre « l'écologie punitive » tout en finançant la sécurité physique face aux intempéries.",concreteEuroImpactNelly:"Travaux de digues et de curage de la Touloubre facilités sans blocage administratif environnemental pour protéger sa maison de 305k€ contre les risques d'inondation.",riskOrDrawback:"Absence de plan d'adaptation massif face au réchauffement climatique extrême dans le Sud de la France."}},{category:"Bien Commun & Cadre de Vie",title:"Sécurité Locale, Tranquillité Publique & Justice des Mineurs",lfiProposal:{measure:"Rétablissement de la police républicaine de proximité (îlotiers de quartier formés à la désescalade), démantèlement des brigades jugées conflictuelles, abolition du contrôle au faciès (récépissé de contrôle), et justice des mineurs axée sur l'éducation et la réinsertion.",legalInstrument:"Loi d'orientation et de programmation du Ministère de l'Intérieur (LOPMI)",programSource:"Programme NFP Juin 2024 & Livret Sécurité et Libertés LFI",feasibilityProbability:"Moyenne (50-70%)",feasibilityExplanation:"Hostilité syndicale policière importante nécessitant une reprise en main politique complète de l'institution.",whyAndHow:"Recréer le lien de confiance entre la jeunesse et les forces de l'ordre par une présence pédestre bienveillante et dissuasive.",concreteEuroImpactNelly:"Climat d'apaisement dans les transports scolaires et aux abords du collège Roger Carcassonne pour ses 2 filles, mais craintes d'une réponse pénale trop clémente face aux incivilités récurrentes.",riskOrDrawback:"Risque de sentiment d'impunité si la réponse pénale immédiate tarde à intervenir."},rnProposal:{measure:"Tolérance zéro : peines planchers obligatoires pour les atteintes aux personnes, fin des réductions automatiques de peine, abaissement de la majorité pénale à 16 ans, armement généralisé des polices municipales et construction de 20 000 places de prison.",legalInstrument:"Projet de Loi de Sécurité Nationale & Réforme du Code Pénal",programSource:"Programme RN Sécurité & Justice 2022-2027",feasibilityProbability:"Haute (>85%)",feasibilityExplanation:"Tr ssujettis quittaient la France chaque année, soit 0,2% à 0,3% des redevables de l'ISF, emportant entre 2 et 3 milliards d'euros de capital annuel.","Après la réforme de 2018 (remplacement de l'ISF par l'IFI et PFU à 30%), les départs de gros patrimoines ont diminué de ~40% (environ 350-400 départs/an) et les retours ont progressé de +20% à +30%, ramenant le solde migratoire net proche de l'équilibre.","Constat fondamental : La suppression de l'ISF a ralenti l'exil fiscal, mais France Stratégie souligne qu'aucun effet d'entraînement économique spectaculaire sur l'investissement productif des entreprises ni sur le PIB n'a pu être prouvé statistiquement."],takeawayForPublic:"La fuite des très riches sous l'ISF existait bel et bien (2 à 3 Mds€/an), mais elle ne concernait qu'une fraction marginale (0,25%) des assujettis. La fin de l'ISF a freiné les départs sans pour autant créer de miracle économique."},{id:"kleven-saez-2020",author:"Henrik Kleven, Camille Landais, Emmanuel Saez, Stefanie Stantcheva",institution:"Quarterly Journal of Economics & Annual Review of Economics",title:"Taxation and International Mobility of Top Earners: A Review and Synthesis",year:"2020",sampleAndMethod:"Méta-analyse économétrique sur les mobilités transfrontalières de hauts revenus (sportifs d'élite, fondateurs de start-ups, cadres dirigeants, détenteurs d'actifs liquides) en Europe et aux USA.",keyFindings:["L'élasticité de migration fiscale varie considérablement selon la nature des actifs et l'ancrage territorial : elle est très faible (0,1 à 0,3) pour les chefs d'entreprise de PME ancrés localement et les détenteurs d'immobilier.","Elle est en revanche très forte (0,8 à 1,6) pour les fondateurs de la tech, les gestionnaires de fonds, les cadres nomades et les détenteurs de portefeuilles financiers liquides.","Au-delà d'un taux marginal effectif de prélèvement de 65% à 70%, les comportements basculent : la délocalisation physique vers la Suisse, la Belgique, Dubaï ou le Royaume-Uni l'emporte sur la simple optimisation fiscale interne."],takeawayForPublic:"Les entrepreneurs locaux (comme Nelly) et l'immobilier ne fuient pas. En revanche, le capital financier liquide et les multinationales se déplacent très rapidement dès que la fiscalité devient confiscatoire (>65%)."},{id:"zucman-piketty-2024",author:"Gabriel Zucman & Thomas Piketty",institution:"EU Tax Observatory & World Inequality Lab (Paris School of Economics)",title:"A Proposal for a Wealth Tax and Citizenship-Based Universal Taxation",year:"2024",sampleAndMethod:"Modélisation macroéconomique des flux de capitaux internationaux et proposition d'architecture fiscale extraterritoriale inspirée du FATCA américain.",keyFindings:["L'exil fiscal n'est pas une fatalité naturelle : il est le produit de failles juridiques et de l'absence de taxation extraterritoriale en Europe.","Proposition centrale : instaurer un « impôt universel lié à la nationalité » (tout citoyen français résidant à Dubaï ou en Suisse paie le différentiel d'impôt au fisc français) assorti d'une Exit Tax sur 10 ans.","Un impôt mondial de 2% sur les 3 000 milliardaires mondiaux rapporterait 250 milliards de dollars par an sans détruire l'économie."],takeawayForPublic:"Pour Zucman et Piketty, taxer les ultra-riches est parfaitement viable à condition de verrouiller juridiquement les frontières fiscales avec un passeport fiscal et une Exit Tax renforcée."}],Wo={title:"Pourquoi l'« Impôt Universel » de LFI se heurte à un mur juridique",subtitle:"L'Article 55 de la Constitution et les Traités Internationaux",obstacles:[{title:"L'Article 55 de la Constitution & 120 Conventions Fiscales Bilatérales",badge:"Blocage Juridique Majeur",badgeColor:"rose",description:"En droit français, l'article 55 de la Constitution accorde une valeur supérieure aux traités internationaux sur la loi ordinaire. Or, la France a signé plus de 120 conventions fiscales bilatérales fondées sur le critère de la RESIDENCE FISCALE et non de la nationalité. Pour taxer un Français vivant en Suisse ou en Belgique, la France devrait renégocier unilatéralement 120 traités, ce que les États tiers refuseraient catégoriquement."},{title:"Droit Européen : Liberté de Circulation des Capitaux et Personnes",badge:"Cour de Justice de l'UE (CJUE)",badgeColor:"amber",description:"Les articles 21, 45 et 63 du Traité sur le Fonctionnement de l'Union Européenne (TFUE) garantissent la liberté d'établissement et de circulation. La CJUE (arrêts Lasteyrie du Saillant et N.) a jugé que toute Exit Tax créant un obstacle financier disproportionné au départ d'un citoyen européen est illégale."},{title:"Plafonnement Constitutionnel de la Capacité Contributive",badge:"Conseil Constitutionnel",badgeColor:"purple",description:"Le Conseil constitutionnel (Décision n° 2012-662 DC sur la tranche à 75%) sanctionne toute imposition confiscatoire. Tout cumul d'IR, de CSG, de cotisations et d'ISF dépassant 70% à 75% des revenus nets est censuré d'office au nom de l'article 13 de la Déclaration des Droits de l'Homme de 1789."}]},ed={title:"L'Effet Ricochet sur Nelly (70 000 €) & l'Agence Nell'Immo",subtitle:"Quand la surtaxe des ultra-riches ne rapporte pas les milliards espérés, qui paie la note ?",risks:[{mechanism:"1. Élargissement forcé de la base fiscale vers la classe moyenne supérieure",impactOnNelly:"Si la taxation des milliardaires rapporte 15 Mds€ au lieu des 100 Mds€ prévus (à cause des conventions bilatérales et des départs), le gouvernement est contraint d'abaisser les seuils. Nelly, avec ses 70 000 € de revenu net, devient la cible prioritaire des surtaxes de CSG et du barème IR durci.",financialVulnerability:"Risque de hausse d'impôt de +2 500 € à +4 000 €/an si elle ne sanctuarise pas ses flux en charges professionnelles déductibles."},{mechanism:"2. Gel des investisseurs locatifs privés sur le pays d'Aix / Salon",impactOnNelly:"La menace d'un retour de l'ISF élargi à l'immobilier et de l'encadrement généralisé des loyers pousse les investisseurs bailleurs à l'attentisme ou au retrait. Les mandats d'investissement locatif chez Nell'Immo chutent de 25%.",agencyCountermeasure:"Basculer l'agence sur la transaction de résidences principales familiales (primo et secundo-accédants de Pélissanne) et développer la gestion locative sécurisée avec garantie des loyers."},{mechanism:"3. Choc des Taux d'Intérêt par l'écart de dette (Spread OAT-Bund)",impactOnNelly:"Si les créanciers internationaux paniquent face à un budget non financé (que ce soit LFI ou RN), le taux souverain français s'envole. Les banques répercutent ce coût : les prêts immobiliers passent de 3,5% à 4,5%+, éliminant 15% des acquéreurs potentiels de Nell'Immo.",agencyCountermeasure:"Nouer un partenariat exclusif avec un courtier en crédit local pour valider le financement des acquéreurs avant toute signature de compromis."}]},q1=[{statement:"« Si on taxe les ultra-riches à 70%, ils vont tous partir à l'étranger du jour au lendemain. »",verdict:"NUANCÉ & CONDITIONNEL",verdictColor:"amber",explanation:"Faux pour la majorité, vrai pour les plus mobiles. 99,7% des assujettis à l'ISF sont restés en France. Cependant, les 0,3% qui partent représentent les capitaux les plus liquides et dynamiques (2 à 3 Mds€/an). L'exil est réel mais concentré sur une minorité hyper-mobile.",source:"France Stratégie (2023) & DGFiP"},{statement:"« La suppression de l'ISF en 2018 a relancé massivement l'investissement et la croissance en France. »",verdict:"FAUX",verdictColor:"rose",explanation:"Le rapport final d'évaluation de France Stratégie (2023) confirme que si la fin de l'ISF a effectivement réduit les départs de 40%, aucun effet positif statistiquement significatif n'a été mesuré sur l'investissement productif des entreprises ni sur la croissance du PIB.",source:"Rapport Comité Lenglart, France Stratégie (Octobre 2023)"},{statement:"« La France peut instaurer un impôt universel comme les États-Unis (FATCA) dès 2027. »",verdict:"FAUX",verdictColor:"rose",explanation:"Les
